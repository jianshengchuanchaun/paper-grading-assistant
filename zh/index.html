<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="阅卷有方 GradeFlow — 双语 AI 辅助试卷批改、教师复核与学情分析。A bilingual grading workspace with teachers in control."
    />
    <title>阅卷有方 · GradeFlow</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../assets/styles.css" />
    <script defer src="../assets/core.js"></script>
    <script defer src="../assets/i18n.js"></script>
    <script defer src="../assets/comments.js"></script>
    <script defer src="../assets/app.js"></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content / 跳到内容</a>
    <div id="app"><div class="loading">GradeFlow · 阅卷有方</div></div>
    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input
      type="file"
      id="papers-input"
      accept="image/jpeg,image/png,image/webp,application/pdf"
      multiple
      hidden
    />
    <input
      type="file"
      id="backup-input"
      accept="application/json,.json"
      hidden
    />
    <input
      type="file"
      id="rubric-input"
      accept="text/plain,text/markdown,.txt,.md"
      hidden
    />
    <noscript
      >请启用 JavaScript 使用批改工作台。Enable JavaScript to use the
      workspace.</noscript
    >
  </body>
</html>
